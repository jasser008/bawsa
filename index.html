<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ff4e78,#ff758c,#ff7eb3);
  overflow:hidden;
  color:white;
  text-align:center;
}

.container{
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  padding:40px;
  border-radius:25px;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  width:90%;
  max-width:600px;
  animation: fadeIn 1.5s ease-in-out;
}

h1{
  font-size:40px;
  font-weight:600;
}

p{
  margin:20px 0;
  font-size:18px;
}

button{
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff4e78;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  background:#ffe6ec;
}

#message{
  margin-top:20px;
  font-size:20px;
  display:none;
  animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-50px;
  font-size:20px;
  animation: float 5s linear infinite;
  color:white;
}

@keyframes float{
  0%{transform:translateY(0); opacity:1;}
  100%{transform:translateY(-100vh); opacity:0;}
}
</style>
</head>
<body>

<div class="container">
  <h1>Happy Valentine's Day ❤️</h1>
  <p>You make my world brighter every single day ✨</p>

  <button onclick="showMessage()">Open Your Surprise 🎁</button>
  <div id="message">I Love You More Than Words Can Say 💖</div>
</div>

<script>
// Surprise message
function showMessage(){
  document.getElementById("message").style.display="block";
}

// Floating hearts generator
function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 10 + "px";
  heart.style.animationDuration = Math.random() * 3 + 3 + "s";
  document.body.appendChild(heart);

  setTimeout(()=>{ heart.remove(); },5000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
